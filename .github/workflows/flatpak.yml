name: flatpak

# Flathub builds with no network, so every crate has to be named with its
# checksum ahead of time in build-aux/flatpak/cargo-sources.json. That file is
# generated from Cargo.lock and is stale the moment a dependency moves, which
# here means the grouped Dependabot pull request every week. Regenerating it by
# hand is a step nobody would remember, so this does it and commits the result
# onto the branch that moved Cargo.lock.
#
# A pull request from a fork cannot be pushed to, and this fails there rather
# than pretending otherwise. Regenerate it locally in that case:
#
#   python3 flatpak-cargo-generator.py Cargo.lock -o build-aux/flatpak/cargo-sources.json

on:
  pull_request:
    paths: ['Cargo.lock']
  push:
    branches: [main]
    paths: ['Cargo.lock']

permissions:
  contents: write

jobs:
  cargo-sources:
    runs-on: ubuntu-latest
    steps:
      # The branch itself rather than the merge commit, because this pushes back.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install the generator's dependencies
        run: pip install aiohttp tomlkit

      # Pinned to a commit rather than tracking master. This script decides
      # which bytes go into a build that Flathub then signs and ships, so it is
      # not something to fetch unread.
      - name: Fetch the generator
        env:
          COMMIT: f03a673abe6ce189cea1c2857e2b44af2dd79d1f
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/$COMMIT/cargo/flatpak-cargo-generator.py"

      - name: Regenerate
        run: |
          python3 "$RUNNER_TEMP/flatpak-cargo-generator.py" Cargo.lock \
            -o build-aux/flatpak/cargo-sources.json

      - name: Commit it if it moved
        run: |
          if git diff --quiet -- build-aux/flatpak/cargo-sources.json; then
            echo "Already in step with Cargo.lock."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-aux/flatpak/cargo-sources.json
          git commit -m 'Regenerate the Flatpak cargo sources'
          git push
