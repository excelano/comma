[package]
name = "comma"
version = "0.1.0"
edition = "2024"
# The GTK bindings ask for this, and it is well above the 1.85 Debian 13 ships,
# so building from source means a toolchain from rustup rather than from apt.
rust-version = "1.92"
description = "Edit delimited text files"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/comma"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pangocairo = "0.22.8"
# The spreadsheet address grammar, shared with xled and xshape rather than
# spelled out a fourth time. Comma uses the column letters from it today; what
# it is really for is the day a selection is something a person can name.
xaddr = "0.2"

[profile.release]
lto = "thin"

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
