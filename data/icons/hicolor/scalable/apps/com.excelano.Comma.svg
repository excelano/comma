<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Comma's icon: a comma on a sheet.

       The name was chosen because a comma can be drawn and a delimiter cannot, so
       the mark is the whole of it. It sits low and large, with the tail well below
       the middle of the tile, because that is what tells a comma from an
       apostrophe at a glance — and Apostrophe is the app this one is a sibling to.

       The artwork stays inside an eight pixel margin, as GNOME's app icons do, so
       that the shell can round and shadow the tile without cutting into it.

       Author: David M. Anderson
       Built with AI assistance (Claude, Anthropic) -->
  <defs>
    <linearGradient id="sheet" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e4e1"/>
    </linearGradient>
    <linearGradient id="mark" x1="44" y1="26" x2="84" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c3fa8"/>
      <stop offset="1" stop-color="#3f1d6b"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="22" fill="url(#sheet)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="21.5" fill="none"
        stroke="#000000" stroke-opacity="0.18" stroke-width="1"/>

  <!-- The ruled line the mark sits on: enough to say "a table" without drawing
       a grid, which is what every other CSV icon already looks like. -->
  <rect x="26" y="99" width="76" height="4" rx="2" fill="#000000" fill-opacity="0.12"/>

  <path fill="url(#mark)"
        d="M64 26c15.6 0 26.4 11.6 26.4 27.3 0 22.1-14.7 36.4-33.8 43.3l-7.2-12.1c11.9-4.8 19.1-11.9 21.5-20.6-1.2 1-3.6 1.4-7.2 1.4-14.3 0-25-9.9-25-24.2C38.7 37.4 49.5 26 64 26z"/>
</svg>
